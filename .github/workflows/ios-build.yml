name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Application (Swift & SwiftUI)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcodebuild -list -project "ios/FylloFileManager.xcodeproj"

      - name: Build iOS App (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "ios/FylloFileManager.xcodeproj" \
            -scheme "FylloFileManager" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Archive and Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FylloFileManager-iOS-Build
          path: build/Release-iphonesimulator/FylloFileManager.app
          if-no-files-found: warn
