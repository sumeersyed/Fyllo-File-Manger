name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Application (Swift & SwiftUI)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          cd ios
          xcodebuild -list -project FylloFileManager.xcodeproj

      - name: Build iOS App
        run: |
          cd ios
          xcodebuild clean build \
            -project FylloFileManager.xcodeproj \
            -scheme FylloFileManager \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            BUILD_DIR="../build"

      - name: Archive and Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FylloFileManager-iOS-Build
          path: build/Debug-iphonesimulator/FylloFileManager.app
          if-no-files-found: warn
