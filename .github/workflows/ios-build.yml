name: Build iOS App & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Application & Package .IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          cd ios
          xcodebuild -list -project FylloFileManager.xcodeproj

      - name: Build iOS App for Device
        run: |
          cd ios
          xcodebuild clean build \
            -project FylloFileManager.xcodeproj \
            -scheme FylloFileManager \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            BUILD_DIR="../build" 2>&1 | tee ../build.log || {
              echo "### Xcode Build Log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 200 ../build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 65
            }

      - name: Ad-Hoc Sign & Package .IPA File
        run: |
          # Ad-hoc sign the app bundle so MobileInstallation & ios-deploy accept the bundle structure
          codesign --force --deep --sign - build/Release-iphoneos/FylloFileManager.app
          
          # Create IPA package
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/FylloFileManager.app build/Payload/
          cd build
          zip -qr FylloFileManager.ipa Payload
          ls -lh FylloFileManager.ipa

      - name: Archive and Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FylloFileManager-IPA
          path: |
            build/FylloFileManager.ipa
            build/Release-iphoneos/FylloFileManager.app
            build.log
          if-no-files-found: warn
